<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 127.0.0.1:* because Electron selects an available backend port at startup. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:* data: blob: mediastream:; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>PackLab 3D</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash">
    <canvas id="splash-canvas"></canvas>
    <img id="splash-logo" class="splash-logo" alt="" />
    <div class="splash-title">PackLab 3D</div>
    <div class="splash-slogan" data-i18n="splash.slogan">Precision Packaging Design.</div>
    <div id="loading-container">
      <div id="loading-text">Loading... 0%</div>
      <div id="loading-bar"><div id="loading-progress"></div></div>
      <div id="loading-stage" class="loading-stage">Desktop interface starting...</div>
      <div id="startup-failure-actions" class="startup-failure-actions" hidden>
        <button id="retry-backend-button" type="button">Retry Backend</button>
      </div>
      <div class="startup-stages__heading">Detailed startup diagnostics</div>
      <div id="startup-stages" class="startup-stages"></div>
    </div>
  </div>

  <div id="app" class="app app--hidden">
    <header class="app-header">
      <div class="app-header__brand">
        <img id="header-logo" alt="" class="app-header__logo" />
        <span data-i18n="splash.appName">PackLab 3D</span>
      </div>
      <div class="app-header__right">
        <button id="diagnostics-button" class="diagnostics-button" type="button">Diagnostics</button>
        <img src="icons/language.svg" alt="" class="icon" />
        <div id="language-switcher" class="language-switcher"></div>
      </div>
    </header>

    <main class="app-grid">
      <section class="panel panel--left" aria-label="Measurements">
        <h2 data-i18n="nav.measurements">Measurements</h2>
        <div id="measurement-form"></div>
        <h2><img src="icons/label.svg" alt="" class="icon" /> <span data-i18n="label.title">Label Design</span></h2>
        <div id="label-style-selector"></div>
        <div id="label-shape-selector"></div>
        <div id="material-selector"></div>
      </section>

      <section class="panel panel--center" aria-label="3D Viewer">
        <div class="viewer-heading"><img src="icons/cube-3d.svg" alt="" class="icon" /> <span data-i18n="viewer.title">3D Viewer</span></div>
        <div id="threejs-viewer" class="viewer"></div>
      </section>

      <section class="panel panel--right" aria-label="Label Design Options">
        <h2><img src="icons/upload.svg" alt="" class="icon" /> <span data-i18n="form.uploadPhoto">Upload Photo</span></h2>
        <div id="photo-uploader"></div>
        <div id="camera-capture"></div>
        <h2><img src="icons/label.svg" alt="" class="icon" /> <span data-i18n="label.content.logo">Logo</span></h2>
        <div id="logo-uploader"></div>
        <h2><img src="icons/label.svg" alt="" class="icon" /> Label Preview</h2>
        <img id="label-preview" class="label-preview" alt="" />
        <div id="pipeline-status" class="pipeline-status"></div>
      </section>

      <section class="panel panel--bottom" aria-label="Export">
        <div id="export-panel"></div>
      </section>
    </main>

    <dialog id="diagnostics-dialog" class="diagnostics-dialog">
      <div class="diagnostics-dialog__header">
        <h2>Diagnostics</h2>
        <button id="diagnostics-close" type="button">Close</button>
      </div>
      <pre id="diagnostics-content"></pre>
      <div class="diagnostics-dialog__actions">
        <button id="diagnostics-copy" type="button">Copy Diagnostics</button>
        <button id="diagnostics-open-logs" type="button">Open Logs</button>
      </div>
    </dialog>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
